<style>

.mono{font-family:"JetBrains Mono",monospace}
#introbg{position:absolute;inset:-80px;background:url(img/matterhorn.jpg) center/cover;filter:blur(10px) brightness(.35) saturate(.8);opacity:0}
#mask{position:absolute;left:0;right:0;top:250px;text-align:center;font:400 470px/1 Anton,Impact,sans-serif;letter-spacing:.01em;color:transparent;background:url(img/matterhorn.jpg) center/1920px auto no-repeat;-webkit-background-clip:text;background-clip:text;opacity:0;white-space:nowrap}

#tag:before{content:"";position:absolute;left:-260px;top:-160px;width:1250px;height:560px;background:radial-gradient(ellipse at 32% 50%,rgba(0,0,0,.6),rgba(0,0,0,0) 68%);z-index:-1}
#tag .act{font:700 24px "JetBrains Mono",monospace;letter-spacing:.42em;color:#ffb547;margin-bottom:6px}
#tag .n{font:400 170px/0.95 Anton,sans-serif;letter-spacing:.03em;transform-origin:0 60%;display:inline-block}
#tag .c{font:700 22px "JetBrains Mono",monospace;letter-spacing:.22em;opacity:.9;margin-top:10px}
#tag .bar{height:5px;background:#ffb547;width:0;margin-top:14px}
#stats{position:absolute;right:130px;top:122px;color:#fff;text-align:right;opacity:0;font:700 22px "JetBrains Mono",monospace;letter-spacing:.2em;line-height:1.2;text-shadow:0 2px 18px rgba(0,0,0,.8)}
#stats div{margin-bottom:10px}#stats b{display:block;font:400 76px Anton,sans-serif;letter-spacing:.05em;color:#ffb547}

#vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 50%,rgba(0,0,0,.6) 100%);pointer-events:none}
#grade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,60,110,.18),rgba(255,140,40,.12));mix-blend-mode:overlay;pointer-events:none}
#bars:before,#bars:after{content:"";position:absolute;left:0;right:0;height:var(--bar,90px);background:#000;z-index:50}
#bars:before{top:0}#bars:after{bottom:0}
#start{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#000;color:#fff;cursor:pointer;z-index:99;gap:18px}
#start b{font:400 64px Anton,sans-serif;letter-spacing:.3em}
#start span{font:200 15px Inter;letter-spacing:.45em;opacity:.7}
#ctl{position:fixed;right:16px;bottom:12px;color:#555;font:12px Inter;z-index:98}
</style>

<body>
<div id="start"><b>WANDER</b><span>▶ PLAY · 38″ · SOUND ON</span></div>
<div id="ctl">R = replay</div>
<div id="stage">
  <div id="introbg"></div>
  <div id="shots"></div>
  <div id="grade"></div>
  <canvas id="fx" width="1920" height="1080"></canvas>
  <div id="crowd"></div>
  <div id="scrimT"></div><div id="scrimB"></div><div id="scrimC"></div>
  <div id="mask">THE WORLD</div>
  <div id="tag"><div class="act"></div><div class="n"></div><div class="c"></div><div class="bar"></div></div>
  <div id="stats"><div>DAY<b id="sd">001</b></div><div>COUNTRIES<b id="sc">01</b></div></div>
  <div id="t"></div>
  <div id="sub"></div>
  <div id="vig"></div>
  <canvas id="grain" width="1920" height="1080"></canvas>
  <div id="flash"></div>
  <div id="bars"></div>
</div>
<script>
const stage=document.getElementById('stage');
function fit(){const s=Math.min(innerWidth/1920,innerHeight/1080);stage.style.transform=`translate(-50%,-50%) scale(${s})`}
addEventListener('resize',fit);fit();
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=t=>1-Math.pow(1-cl(t),4);
const easeIO=t=>{t=cl(t);return t<.5?8*t*t*t*t:1-Math.pow(-2*t+2,4)/2};
const back=t=>{t=cl(t);const c=1.7;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)};
const lerp=(a,b,k)=>a+(b-a)*k;
const BEAT=0.5; // 120 BPM
const END=33.2, TOTAL=38.5;
// beat pulse 0..1 (spikes on every beat after the drop)
const pulse=t=>t<3.6?0:Math.exp(-(((t-3.6)%BEAT))/0.11);

// ---------- the traveler ----------
function traveler(pose,fill='#07080a'){
 const rim='rgba(255,196,130,.55)';
 const arms=pose==='up'
  ?'<path d="M31 46 L10 2 L17 -1 L39 42Z M69 46 L90 2 L83 -1 L61 42Z"/>'
  :'<path d="M30 46 L22 104 L29 105 L38 50Z M70 46 L78 104 L71 105 L62 50Z"/>';
 const pack=pose==='party'?'':'<rect x="34" y="40" width="32" height="54" rx="9"/><ellipse cx="50" cy="40" rx="15" ry="5"/>';
 return `<svg viewBox="0 -5 100 205" preserveAspectRatio="xMidYMax meet"><g fill="${fill}" stroke="${rim}" stroke-width="1.2" stroke-linejoin="round">
  <path d="M36 196 L39 108 L49 108 L48 196Z M52 196 L51 108 L61 108 L64 196Z"/>
  <path d="M33 44 Q50 36 67 44 L65 110 L35 110Z"/>${arms}${pack}
  <circle cx="50" cy="24" r="11"/></g></svg>`;}
// rooftop crowd (party) – raised arms silhouettes
(function(){const c=$('crowd');let h='';const xs=[0,6,12,19,26,33,41,48,56,63,70,78,85,92];
 xs.forEach((x,i)=>{const H=260+((i*53)%90);h+=`<div class="pp" style="position:absolute;left:${x}%;bottom:-40px;height:${H}px;width:${H*.5}px">${traveler(i%3===1?'down':'up','#050507').replace('<svg','<svg style="width:100%;height:100%;filter:none"')}</div>`;});
 c.innerHTML=h;})();

// ---------- SHOTS ----------
// fx: fade | whip | push | glitch | dissolve | cut ; tag:[activity, BIG NAME, coords]
const SH=[
 {img:'machu',a:0,b:.12,fx:'cut',s0:1.25,s1:1.2},
 {img:'surf',a:.12,b:.24,fx:'cut',s0:1.2,s1:1.15},
 {img:'nyc2',a:.24,b:.36,fx:'cut',s0:1.2,s1:1.15},
 {img:'balloon',a:.36,b:.5,fx:'cut',s0:1.2,s1:1.3},
 {img:'matterhorn',a:4.3,b:7.05,fx:'fade',s0:1.3,s1:1.08,y0:-40,y1:30,tag:['DAY 001 · THE BEGINNING','ZERMATT','SWITZERLAND · 45.976°N 7.658°E'],guy:{x:72,b:13,h:240}},
 // city montage, beat-synced
 {img:'shibuya',  a:7.0, b:8.05, fx:'whip',dir:1,s0:1.25,s1:1.12,x0:60,x1:-60,tag:['CITY LIGHTS','TOKYO','JAPAN · 35.659°N 139.700°E']},
 {img:'timessq',  a:8.0, b:8.8, fx:'push',s0:1.1,s1:1.28,tag:['CITY LIGHTS','NEW YORK','USA · 40.758°N 73.985°W']},
 {img:'dubai',    a:8.75,b:9.55,fx:'whip',dir:-1,s0:1.3,s1:1.15,y0:30,y1:-30,tag:['CITY LIGHTS','DUBAI','UAE · 25.197°N 55.274°E']},
 {img:'petra',    a:9.5, b:10.05,fx:'glitch',s0:1.12,s1:1.24,tag:['ANCIENT WONDERS','PETRA','JORDAN · 30.328°N 35.444°E']},
 {img:'halong',   a:10.0,b:10.55,fx:'whip',dir:1,s0:1.25,s1:1.12,x0:-40,x1:40,tag:['ANCIENT WONDERS','HẠ LONG','VIETNAM · 20.910°N 107.184°E']},
 // activities
 {img:'camino6',  a:10.5,b:12.35,fx:'push',s0:1.08,s1:1.22,tag:['PILGRIMAGE · 800 KM','CAMINO','SPAIN · CAMINO DE SANTIAGO'],guy:{x:40,b:17,h:280},grade:' sepia(.25) brightness(1.08)'},
 {img:'camino1',  a:12.3,b:13.05,fx:'dissolve',s0:1.08,s1:1.2,tag:['PILGRIMAGE · 800 KM','SANTIAGO','SPAIN · 42.880°N 8.545°W']},
 {img:'everest',  a:13.0,b:15.55,fx:'whip',dir:-1,s0:1.25,s1:1.08,y0:-30,y1:20,tag:['TREKKING · 5,364 M','HIMALAYA','NEPAL · 27.988°N 86.925°E'],guy:{x:14,b:13,h:270}},
 {img:'sail3',    a:15.5,b:17.55,fx:'whip',dir:1,s0:1.06,s1:1.2,x0:60,x1:-40,tag:['SAILING','OPEN OCEAN','ATLANTIC → MEDITERRANEAN'],grade:' sepia(.45) saturate(1.6) hue-rotate(-12deg) brightness(1.12)'},
 {img:'surf',     a:17.5,b:19.55,fx:'push',s0:1.3,s1:1.12,tag:['SURFING','BIG WAVE','CALIFORNIA · 37.495°N 122.497°W']},
 {img:'balloon',  a:19.5,b:21.55,fx:'whip',dir:-1,s0:1.12,s1:1.26,y0:30,y1:-30,tag:['HOT AIR BALLOON','CAPPADOCIA','TURKEY · 38.643°N 34.828°E']},
 {img:'aurora',   a:21.5,b:23.55,fx:'dissolve',s0:1.06,s1:1.2,tag:['NORTHERN LIGHTS','AURORA','ALASKA · 64.665°N 147.101°W'],guy:{x:26,b:13,h:230}},
 {img:'nyc2',     a:23.5,b:26.55,fx:'push',s0:1.25,s1:1.08,tag:['ROOFTOP PARTY','MANHATTAN','NEW YORK · TOP OF THE ROCK']},
 // breath + climax
 {img:'moraine',  a:26.5,b:28.35,fx:'dissolve',s0:1.08,s1:1.22,y0:20,y1:-20,tag:['STILLNESS','MORAINE LAKE','CANADA · 51.322°N 116.186°W'],noCenter:1,guy:{x:13,b:42,h:110}},
 {img:'canyon',   a:28.3,b:29.65,fx:'push',s0:1.3,s1:1.12,x0:80,x1:-40,tag:['THE EDGE','GRAND CANYON','ARIZONA · 36.107°N 112.113°W'],noCenter:1,guy:{x:20,b:18,h:280}},
 {img:'camino6',a:29.6,b:29.8,fx:'cut',s0:1.3,s1:1.3},{img:'timessq',a:29.8,b:30.0,fx:'cut',s0:1.3,s1:1.3},{img:'everest',a:30.0,b:30.1,fx:'cut',s0:1.3,s1:1.3},
 {img:'sail3',a:30.1,b:30.2,fx:'cut',s0:1.3,s1:1.3},
 {img:'balloon',a:30.2,b:30.28,fx:'cut',s0:1.3,s1:1.3},
 {img:'aurora',a:30.28,b:30.36,fx:'cut',s0:1.3,s1:1.3},
 {img:'nyc2',a:30.36,b:30.43,fx:'cut',s0:1.3,s1:1.3},
 {img:'surf',a:30.43,b:30.5,fx:'cut',s0:1.3,s1:1.3},
 {img:'machu',    a:30.5,b:32.4,fx:'fade',s0:1.04,s1:1.24,y0:-20,y1:20,tag:['DAY 365','MACHU PICCHU','PERU · 13.163°S 72.545°W'],noCenter:1,guy:{x:72,b:11,h:430,pose:'up'}},
];
const shots=$('shots');
SH.forEach(s=>{const d=document.createElement('div');d.className='shot';d.style.backgroundImage=`url(img/${s.img}.jpg)`;
 if(s.guy){d.insertAdjacentHTML('beforeend',traveler(s.guy.pose));const v=d.lastChild;v.style.left=`calc(${s.guy.x}% - ${s.guy.h*.25}px)`;v.style.bottom=s.guy.b+'%';v.style.height=s.guy.h+'px';v.style.width=s.guy.h*.5+'px';}
 shots.appendChild(d);s.el=d;});
function drawShots(t){
 SH.forEach(s=>{
  if(!(t>=s.a&&t<s.b+.05)){s.el.style.opacity=0;return;}
  const k=cl((t-s.a)/(s.b-s.a)),ein=cl((t-s.a)/.28);
  let sc=lerp(s.s0,s.s1,easeIO(k)),x=lerp(s.x0||0,s.x1||0,k),y=lerp(s.y0||0,s.y1||0,k),blur=0,op=1,extra='';
  if(s.fx==='whip'){x+=(1-ease(ein))*950*s.dir;blur=(1-ease(ein))*28;sc+=.05*Math.exp(-((t-s.a)/.12));}
  else if(s.fx==='push'){sc+=(1-ease(cl((t-s.a)/.35)))*.5;blur=(1-ease(cl((t-s.a)/.3)))*14;}
  else if(s.fx==='glitch'){if((t-s.a)<.22){x+=(Math.random()-.5)*80;extra=` drop-shadow(${12+Math.random()*16}px 0 0 rgba(255,0,60,.7)) drop-shadow(-${12+Math.random()*16}px 0 0 rgba(0,220,255,.7))`;}}
  else if(s.fx==='dissolve'){op=easeIO(cl((t-s.a)/.5));}
  else if(s.fx==='fade'){op=cl((t-s.a)/.7);sc+=(1-ease(ein))*.05;}
  if(t>=7&&t<26.5&&s.fx!=='cut') sc+=.012*pulse(t); // image breathes on the beat
  s.el.style.opacity=op;
  if(s.guy){const v=s.el.querySelector('svg');v.style.transform=s.guy.pose==='up'?`scale(${1+.04*pulse(t)}) translateY(${-6*pulse(t)}px)`:`translateY(${Math.abs(Math.sin((t-s.a)*6))*-5}px) translateX(${(t-s.a)*14}px)`;v.style.transformOrigin='50% 100%';}
  s.el.style.transform=`translate(${x}px,${y}px) scale(${sc})`;
  s.el.style.filter=`blur(${blur}px) saturate(1.15) contrast(1.08)`+(s.grade||'')+extra+(s.img==='nyc2'&&t>23.5?` brightness(${1+.18*pulse(t)})`:'');
 });
 $('introbg').style.opacity=cl((t-.55)/.6)*cl((3.4-t)/.3);
 $('introbg').style.transform=`scale(${1.1+t*.02})`;
 // party crowd bounces on the beat
 const cr=cl((t-23.7)/.3)*cl((26.5-t)/.2);$('crowd').style.opacity=cr;
 if(cr>0)document.querySelectorAll('.pp').forEach((p,i)=>{p.style.transform=`translateY(${-pulse(t+i*.07)*22}px) rotate(${Math.sin(t*6+i)*3}deg)`;});
}

// ---------- BIG LOCATION TITLE (scale in, then pulses with the beat) ----------
let curTag=null;
function drawTag(t){
 const s=SH.find(s=>s.tag&&t>=s.a&&t<s.b);const el=$('tag');
 if(!s||t>END-.4){el.style.opacity=0;return;}
 if(curTag!==s){curTag=s;el.querySelector('.act').textContent=s.tag[0];el.querySelector('.n').textContent=s.tag[1];}
 const k=t-s.a,out=cl((s.b-t)/.12);
 el.style.opacity=cl(k/.1)*out;
 const n=el.querySelector('.n');
 if(!s.w){s.w=el.offsetWidth||900;s.h=el.offsetHeight||260;}
 const dur=s.b-s.a, center=!s.noCenter;
 const ph=center?(dur<1.0?0:easeIO((k-.42)/.38)):1;          // 0 = centre stage, 1 = corner
 const S=Math.min(2.4,1250/s.w);
 const tx=lerp(960-s.w*S/2-130,0,ph), ty=lerp(540-s.h*S/2-118,0,ph), ts=lerp(S,1,ph);
 el.style.transform=`translate(${tx}px,${ty}px) scale(${ts})`;
 el.querySelector('.c').style.opacity=ph;
 const inS=lerp(1.9,1,back(k/.42));               // slams in big → settles (shrink)
 const grow=1+.06*cl((k-.4)/(s.b-s.a));             // slow grow while held
 const p=.07*pulse(t);                               // beat pump (bigger ↔ smaller)
 n.style.transform=`scale(${inS*grow+p})`;
 n.style.filter=`blur(${(1-ease(k/.3))*16}px)`;
 n.style.letterSpacing=(.18-ease(k/.6)*.15)+'em';
 el.querySelector('.bar').style.width=(ease(k/.45)*160)+'px';
 if(!center||ph>0)void 0;
 el.querySelector('.act').style.opacity=cl((k-.1)/.2);
 el.querySelector('.c').textContent=k<.3?s.tag[2].replace(/\d/g,()=>Math.floor(Math.random()*10)):s.tag[2];
}

// ---------- STATS ----------
function drawStats(t){
 const v=cl((t-7)/.3)*cl((30-t)/.3);$('stats').style.opacity=v;
 const k=easeIO((t-7)/23.5);
 $('sd').textContent=String(Math.max(1,Math.round(k*365))).padStart(3,'0');
 
 $('sc').textContent=String(Math.max(1,Math.round(k*31))).padStart(2,'0');
}

cues.forEach(c=>{const d=document.createElement('div');d.className='txt anton';d.style.top=c.y+'px';d.style.fontSize=c.size+'px';d.style.textShadow='0 8px 50px rgba(0,0,0,.7), 0 2px 8px rgba(0,0,0,.5)';if(c.color)d.style.color=c.color;

let t0=null,raf,lastG=0;
function render(t){drawShots(t);drawTag(t);drawStats(t);drawSub(t);drawCues(t);drawFX(t);drawFlash(t);}
function frame(now){const t=(now-t0)/1000;render(t);if(now-lastG>40){drawGrain();lastG=now;}if(t<TOTAL+1)raf=requestAnimationFrame(frame);}
function play(){$('start').style.display='none';if(AC){try{master.disconnect()}catch(e){}AC.close();}audioInit();cancelAnimationFrame(raf);t0=performance.now()+30;score(AC.currentTime+.03);raf=requestAnimationFrame(frame);}
$('start').onclick=play;addEventListener('keydown',e=>{if(e.key==='r'||e.key==='R')play();});
drawGrain();
